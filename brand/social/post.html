<style>
  .frame { width:1080px; height:1350px; padding:88px 84px 76px;
    display:flex; flex-direction:column;
    background:
      radial-gradient(ellipse 900px 620px at 12% 6%, rgba(124,77,255,.42), transparent 62%),
      radial-gradient(ellipse 820px 640px at 92% 88%, rgba(34,211,238,.30), transparent 60%),
      linear-gradient(160deg, #14162e 0%, #0B0D1C 62%); }

  .marca { display:flex; align-items:center; gap:22px; }
  .marca img { width:74px; height:74px; }
  .marca .nome { color:#fff; font-size:40px; font-weight:700; letter-spacing:3px; }
  .selo { margin-left:auto; color:#9fb3ff; font-size:24px; letter-spacing:2px;
          border:2px solid rgba(159,179,255,.35); border-radius:999px; padding:10px 24px; }

  .arte { margin:74px 0 12px; display:flex; justify-content:center; }

  h1 { color:#fff; font-size:82px; font-weight:800; line-height:1.06;
       letter-spacing:-1.5px; margin-top:auto; }
  h1 .g { background:linear-gradient(100deg,#9D7BFF,#5B7BFF 42%,#22D3EE);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  p.sub { color:rgba(255,255,255,.66); font-size:34px; line-height:1.42; margin-top:30px; }

  .chips { display:flex; flex-wrap:wrap; gap:16px; margin-top:44px; }
  .chip { color:rgba(255,255,255,.86); font-size:26px; padding:14px 28px;
          border-radius:999px; background:rgba(255,255,255,.055);
          border:1px solid rgba(255,255,255,.10); }

  .rodape { margin-top:52px; display:flex; align-items:center; gap:24px; }
  .barra { height:6px; flex:1; border-radius:999px;
           background:linear-gradient(90deg,#7C4DFF,#4364F7,#22D3EE); }
  .rodape span { color:rgba(255,255,255,.52); font-size:25px; letter-spacing:1px; }
</style>
