# Deploy LEVE do backend (para VMs de 1 GB, ex.: Oracle AMD E2.1.Micro).
#
# Usa SQLite e dispensa Postgres/Redis, cabendo com folga em 1 GB de RAM.
# Só Caddy (HTTPS) + API. Ideal quando a capacidade ARM (A1.Flex) está esgotada.
#
# Uso (na pasta deploy/, com .env preenchido — DOMAIN e DESKSIDE_JWT_SECRET):
#   docker compose -f docker-compose.lite.yml up -d --build
#
# (POSTGRES_PASSWORD não é usado aqui.)

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      # A **pasta**, não o arquivo. Montar um arquivo solto prende o contêiner
      # ao inode: o `git reset --hard` substitui o arquivo (inode novo) e o
      # contêiner continua vendo o antigo para sempre. Foi assim que uma
      # correção de roteamento ficou no disco do VPS enquanto o proxy quebrado
      # seguia no ar - e o `caddy reload`, lendo de dentro do contêiner,
      # recarregava a versão velha com sucesso.
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ../backend
    restart: unless-stopped
    # **Todo** o `.env` entra no contêiner, e não só as variáveis listadas
    # abaixo. A lista explícita era o caminho anterior, e ela tem um modo de
    # falhar que não deixa rastro: uma variável nova no `.env` — as de SMTP
    # foram o caso — é lida pelo compose para substituir `${...}` aqui, mas
    # nunca chega à aplicação. O servidor sobe, o `/health` responde "ok", e o
    # recurso fica desligado sem ninguém errar nada.
    #
    # Com `env_file`, acrescentar uma variável ao `.env` basta. O que fica
    # abaixo em `environment:` é o que **não** vem de lá: o caminho do banco
    # (fixo), e os dois segredos com guarda de nome antigo — `environment`
    # vence `env_file`, então as guardas continuam valendo.
    env_file:
      - .env
    environment:
      # SQLite num volume persistente (4 barras = caminho absoluto /data/...).
      DESKSIDE_DATABASE_URL: sqlite:////data/deskside.db
      DESKSIDE_JWT_SECRET: ${DESKSIDE_JWT_SECRET:?renomeie REMOTEONE_JWT_SECRET para DESKSIDE_JWT_SECRET no deploy/.env}
      # TURN: o backend entrega o endereço e gera as credenciais temporárias.
      # Vazio = só STUN (é o comportamento de antes).
      DESKSIDE_TURN_HOST: ${DOMAIN}
      DESKSIDE_TURN_SECRET: ${DESKSIDE_TURN_SECRET:?renomeie REMOTEONE_TURN_SECRET para DESKSIDE_TURN_SECRET no deploy/.env}
    volumes:
      - apidata:/data
      # As cópias de segurança saem num **bind mount**, e não num volume do
      # Docker, de propósito: elas precisam estar num caminho que dê para
      # copiar por `scp` de fora. Um volume nomeado fica escondido em
      # /var/lib/docker e só sai de lá com mais um comando.
      #
      # Fica dentro do clone do Git, e isso é seguro: a pasta está no
      # .gitignore, e `git reset --hard` não apaga arquivo não versionado.
      - ./backups:/backups
    # Sem `ports:` — só o Caddy alcança a API (rede interna).

  # Servidor de relay (TURN). Sem ele, celular no 5G + computador atrás do
  # roteador de casa **não** fecham conexão direta: os dois lados estão atrás
  # de NAT que não deixa nada entrar, e nenhum par de candidatos funciona. O
  # relay é a última opção do ICE, então não custa nada quando o P2P dá certo.
  #
  # `network_mode: host` não é preguiça: o TURN abre uma porta por sessão na
  # faixa de relay, e mapear faixa por faixa no Docker é frágil e lento. Em
  # host, o coturn vê a rede como ela é.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # Sem shell e sem entrypoint próprio: quem substitui as variáveis é o
    # compose, aqui, antes de o contêiner existir. A versão anterior passava
    # por `sh -c` para descobrir o IP público sozinha, e quando algo ali
    # falhava o contêiner saía calado - sem log nenhum para dizer o quê.
    command:
      - --no-cli
      # Escutar e relayar **só** na placa de verdade. Sem isto o coturn se
      # espalha por tudo o que existe na máquina - incluindo as pontes
      # internas do Docker (172.17.x) e o loopback -, e pode alocar o relay
      # num endereço onde os pacotes que chegam de fora nunca aparecem. A
      # falha seria a pior possível: o TURN responde, o candidato chega ao
      # celular, e a conexão não fecha.
      - --listening-ip=${TURN_LISTEN_IP}
      - --relay-ip=${TURN_LISTEN_IP}
      - --listening-port=3478
      - --fingerprint
      # Sem TLS: quem carrega certificado aqui é o Caddy, na porta 443. Sem
      # estas duas, o coturn procura um certificado que não existe e enche o
      # log de avisos que parecem erro.
      - --no-tls
      - --no-dtls
      # Sem banco de usuários: o coturn confere um HMAC do próprio nome de
      # usuário, que carrega a hora de expiração. É o mesmo segredo que o
      # backend usa para gerar (app/ice.py).
      - --use-auth-secret
      - --static-auth-secret=${DESKSIDE_TURN_SECRET:?renomeie REMOTEONE_TURN_SECRET para DESKSIDE_TURN_SECRET no deploy/.env}
      - --realm=${DOMAIN}
      # Faixa curta de propósito: são 40 portas, o suficiente para dezenas de
      # sessões, e é o que se precisa liberar no firewall da nuvem.
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      # Na Oracle (e em quase toda nuvem) a VM só enxerga o IP privado; sem
      # isto o coturn anuncia o endereço errado e ninguém o alcança.
      - --external-ip=${TURN_EXTERNAL_IP}
      - --log-file=stdout
      - --simple-log

volumes:
  caddy_data:
  caddy_config:
  apidata:
