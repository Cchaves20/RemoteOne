# Deploy LEVE do backend (para VMs de 1 GB, ex.: Oracle AMD E2.1.Micro).
#
# Usa SQLite e dispensa Postgres/Redis, cabendo com folga em 1 GB de RAM.
# Só Caddy (HTTPS) + API. Ideal quando a capacidade ARM (A1.Flex) está esgotada.
#
# Uso (na pasta deploy/, com .env preenchido — DOMAIN e REMOTEONE_JWT_SECRET):
#   docker compose -f docker-compose.lite.yml up -d --build
#
# (POSTGRES_PASSWORD não é usado aqui.)

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # O app web publicado. `:ro` porque o Caddy só lê, e a pasta pode não
      # existir: nesse caso o Docker a cria vazia e o app responde 404 até
      # alguém publicar - melhor do que recusar subir o servidor inteiro.
      - ./app:/srv/app:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      # SQLite num volume persistente (4 barras = caminho absoluto /data/...).
      REMOTEONE_DATABASE_URL: sqlite:////data/remoteone.db
      REMOTEONE_JWT_SECRET: ${REMOTEONE_JWT_SECRET}
      # TURN: o backend entrega o endereço e gera as credenciais temporárias.
      # Vazio = só STUN (é o comportamento de antes).
      REMOTEONE_TURN_HOST: ${DOMAIN}
      REMOTEONE_TURN_SECRET: ${REMOTEONE_TURN_SECRET}
    volumes:
      - apidata:/data
    # Sem `ports:` — só o Caddy alcança a API (rede interna).

  # Servidor de relay (TURN). Sem ele, celular no 5G + computador atrás do
  # roteador de casa **não** fecham conexão direta: os dois lados estão atrás
  # de NAT que não deixa nada entrar, e nenhum par de candidatos funciona. O
  # relay é a última opção do ICE, então não custa nada quando o P2P dá certo.
  #
  # `network_mode: host` não é preguiça: o TURN abre uma porta por sessão na
  # faixa de relay, e mapear faixa por faixa no Docker é frágil e lento. Em
  # host, o coturn vê a rede como ela é.
  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    # Sem shell e sem entrypoint próprio: quem substitui as variáveis é o
    # compose, aqui, antes de o contêiner existir. A versão anterior passava
    # por `sh -c` para descobrir o IP público sozinha, e quando algo ali
    # falhava o contêiner saía calado - sem log nenhum para dizer o quê.
    command:
      - --no-cli
      # Escutar e relayar **só** na placa de verdade. Sem isto o coturn se
      # espalha por tudo o que existe na máquina - incluindo as pontes
      # internas do Docker (172.17.x) e o loopback -, e pode alocar o relay
      # num endereço onde os pacotes que chegam de fora nunca aparecem. A
      # falha seria a pior possível: o TURN responde, o candidato chega ao
      # celular, e a conexão não fecha.
      - --listening-ip=${TURN_LISTEN_IP}
      - --relay-ip=${TURN_LISTEN_IP}
      - --listening-port=3478
      - --fingerprint
      # Sem TLS: quem carrega certificado aqui é o Caddy, na porta 443. Sem
      # estas duas, o coturn procura um certificado que não existe e enche o
      # log de avisos que parecem erro.
      - --no-tls
      - --no-dtls
      # Sem banco de usuários: o coturn confere um HMAC do próprio nome de
      # usuário, que carrega a hora de expiração. É o mesmo segredo que o
      # backend usa para gerar (app/ice.py).
      - --use-auth-secret
      - --static-auth-secret=${REMOTEONE_TURN_SECRET}
      - --realm=${DOMAIN}
      # Faixa curta de propósito: são 40 portas, o suficiente para dezenas de
      # sessões, e é o que se precisa liberar no firewall da nuvem.
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      # Na Oracle (e em quase toda nuvem) a VM só enxerga o IP privado; sem
      # isto o coturn anuncia o endereço errado e ninguém o alcança.
      - --external-ip=${TURN_EXTERNAL_IP}
      - --log-file=stdout
      - --simple-log

volumes:
  caddy_data:
  caddy_config:
  apidata:
