[package]
name = "remoteone-agent"
version = "0.1.0"
edition = "2021"
description = "Agente desktop do RemoteOne: recebe comandos remotos e executa ações no sistema operacional"
license = "MIT"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
gethostname = "0.5"
