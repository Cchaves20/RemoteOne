[package]
name = "deskside-agent"
version = "0.1.0"
edition = "2021"
description = "Agente desktop do Deskside: recebe comandos remotos e executa ações no sistema operacional"
license = "MIT"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
# native-tls habilita wss:// (TLS) para falar com o backend atrás de HTTPS
# (VPS/Caddy). No Windows usa o SChannel nativo do sistema (sem OpenSSL nem
# crypto provider do rustls); no Linux de dev usa OpenSSL.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
gethostname = "0.5"
# MAC da placa de rede local, para Wake-on-LAN (multiplataforma).
mac_address = "1"
# Usado para passar scripts ao PowerShell via -EncodedCommand (sem problemas
# de escape de aspas na linha de comando).
base64 = "0.22"
# Codificação JPEG dos frames (multiplataforma; usada também pelo stub).
# `png` entra porque o icone da bandeja e da janela e um PNG embutido no
# binario (assets/tray.png), decodificado em tempo de execucao.
# `bmp` entra por causa da imagem copiada: o Windows entrega a área de
# transferência em DIB, que é um BMP sem o cabeçalho de arquivo - decodificar
# é o primeiro passo antes de reencodar em PNG para o telefone.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp"] }
# Codificação H.264 do vídeo por WebRTC (medido no spike S2 do plano).
openh264 = "0.9.7"
webrtc = "0.17.2"
# `network` e `component` entram com o painel completo de monitoramento: taxa
# de rede e temperatura. A temperatura vem vazia na maioria dos Windows (a
# leitura exige driver do fabricante), e por isso o campo é opcional dos dois
# lados - ver `system_info.rs`.
sysinfo = { version = "0.38.4", default-features = false, features = ["system", "disk", "network", "component"] }
fast_image_resize = "6.1.0"

# Só no Windows (única plataforma testável aqui). Linux/macOS usam os stubs
# em src/injector.rs e src/capture.rs, sem estas dependências.
[target.'cfg(windows)'.dependencies]
enigo = "0.2"
# 0.9.x traz o backend WGC (Windows.Graphics.Capture), acelerado por hardware,
# no lugar do BitBlt do GDI. A feature não é padrão e precisa ser pedida.
xcap = { version = "0.9", features = ["wgc"] }
# Som do computador indo para o telefone. O `cpal` abre o dispositivo de SAÍDA
# como entrada, que é como o WASAPI faz "loopback" (capturar o que sai pelo
# alto-falante). O `audiopus` traz o Opus, exigido pelo WebRTC - no MSVC ele
# linka uma biblioteca pronta que vem no próprio pacote, sem cmake nem
# compilador C a mais. As duas ficam aqui, e não nas dependências comuns,
# porque o `cpal` no Linux pediria as bibliotecas do ALSA para compilar.
cpal = "0.18"
audiopus = "0.2"
# Área de transferência. Leve e sem C: o que interessa aqui é o `seq_num`, o
# contador que o Windows muda a cada cópia - é ele que permite perceber uma
# cópia nova sem ficar lendo o conteúdo o segundo inteiro.
clipboard-win = "5"
# Atalhos do Menu Iniciar e da area de trabalho. Escreve o .lnk direto, sem
# COM e sem PowerShell: o instalador que dependia de um `powershell.exe` para
# cada passo era lento, piscava janela e e o padrao que antivirus marcam.
mslnk = "0.1"
# A janela e o icone ao lado do relogio.
#
# `wgpu` e nao `glow`, depois de a versao com `glow` falhar numa maquina de
# verdade: "egui_glow requires opengl 2.0+". Maquina virtual costuma nao ter
# OpenGL 2.0, e sessao de Area de Trabalho Remota prende o OpenGL na versao
# 1.1 - instalar por RDP e cenario comum demais num produto de controle
# remoto. No Windows o `wgpu` usa DX12, que existe nos dois casos.
#
# Custa ~75 crates a mais que o `glow`. E o preco de a janela abrir onde o
# usuario esta, e nao so onde o desenvolvedor testou.
#
# A versao 0.31 e nao a 0.29 por um motivo so: e a partir dela que existe o
# `native_adapter_selector`, que deixa escolher a placa de video. Sem ele o
# `egui-wgpu` pede o adaptador com `force_fallback_adapter: false` cravado no
# codigo, e o renderizador por software do Windows nunca e considerado.
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
tray-icon = "0.19"

# Embute o icone e a versao no .exe (ver build.rs). So roda no alvo Windows.
[build-dependencies]
winresource = "0.1"

[dev-dependencies]
image = { version = "0.25", features = ["png"] }
