[package]
name = "remoteone-agent"
version = "0.1.0"
edition = "2021"
description = "Agente desktop do RemoteOne: recebe comandos remotos e executa ações no sistema operacional"
license = "MIT"

[dependencies]
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
# rustls-tls habilita wss:// (TLS) para falar com o backend atrás de HTTPS
# (VPS/Caddy). rustls dispensa OpenSSL do sistema e compila limpo no Windows.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
gethostname = "0.5"
# Codificação JPEG dos frames (multiplataforma; usada também pelo stub).
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# Só no Windows (única plataforma testável aqui). Linux/macOS usam os stubs
# em src/injector.rs e src/capture.rs, sem estas dependências.
[target.'cfg(windows)'.dependencies]
enigo = "0.2"
xcap = "0.0.14"
