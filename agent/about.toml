# Configuração do `cargo about`, que gera LICENCAS-DE-TERCEIROS.txt.
# Regerar depois de mudar dependências: ver scripts/licencas-do-agente.sh.
accepted = [
    "MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0",
    "Unicode-DFS-2016", "MPL-2.0", "CC0-1.0", "BSL-1.0", "0BSD",
    "Unlicense", "CDLA-Permissive-2.0", "OpenSSL", "BSD-2-Clause-Patent",
    # Fontes embutidas pelo egui (a janela do agente): redistribuição livre,
    # com o texto da licença junto - que é o que este arquivo faz.
    "OFL-1.1", "Ubuntu-font-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
