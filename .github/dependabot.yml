# Atualizações de dependências, uma vez por mês, em pull requests.
#
# Um PR por parte (servidor, agente, app, Actions) com todas as atualizações
# dela juntas, em vez de um PR por pacote: no máximo quatro por mês. O Claude
# junta os que passarem no PR seguinte para a `main`, e o Dependabot fecha os
# dele sozinho quando vê as versões novas na branch.
#
# Os PRs vão para a branch de desenvolvimento, que é de onde o servidor e os
# instaladores saem. O CI de cada parte roda nos PRs (pull_request nos
# workflows), e nada entra sem alguém aprovar.
#
# Atenção: o GitHub lê este arquivo da branch **padrão** do repositório. Ele
# só passa a valer quando estiver na `main` (ver docs/revisao-de-codigo.md).
#
# Depois de um PR do `cargo`, regerar as licenças do agente:
# sh scripts/licencas-do-agente.sh
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    target-branch: claude/testing-strategy-multiplatform-0nztwm
    schedule:
      interval: monthly
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /agent
    target-branch: claude/testing-strategy-multiplatform-0nztwm
    schedule:
      interval: monthly
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: pub
    directory: /client
    target-branch: claude/testing-strategy-multiplatform-0nztwm
    schedule:
      interval: monthly
    groups:
      todas:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: claude/testing-strategy-multiplatform-0nztwm
    schedule:
      interval: monthly
    groups:
      todas:
        patterns: ["*"]
