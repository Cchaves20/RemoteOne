name: Backend (FastAPI)

on:
  push:
    # A branch de desenvolvimento também: é dela que o servidor e os
    # instaladores saem. Só na `main`, estes testes nunca rodavam.
    branches: [main, "claude/**"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Vulnerabilidades conhecidas nas dependências travadas. Falha o build:
      # uma versão com falha publicada não pode ir para o servidor sem alguém
      # decidir que pode.
      - name: Auditoria das dependências
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --require-hashes --disable-pip --no-deps

      - name: Testes
        run: pytest

      - name: Build da imagem Docker
        run: docker build -t deskside-backend .
