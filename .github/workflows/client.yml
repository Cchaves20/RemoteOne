# Cliente Flutter: análise estática + testes de widget + APK Android.
# O Android é coberto aqui e no emulador local; iOS fica no codemagic.yaml
# (runner macOS do GitHub custa 10x a cota — evitamos usá-lo para o cliente).
name: Client (Flutter)

on:
  push:
    # A branch de desenvolvimento também: é dela que o servidor e os
    # instaladores saem. Só na `main`, estes testes nunca rodavam.
    branches: [main, "claude/**"]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixa, e a mesma do `environment` do pubspec: a "última estável"
          # muda sozinha, e foi assim que a 3.50 reprovou a análise inteira
          # (material.dart obsoleto) sem nada ter mudado no app. Subir de
          # versão é uma decisão, feita aqui e nas máquinas que compilam.
          flutter-version: 3.50.0
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes de widget
        run: flutter test

  android-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21, como no Codemagic: o lint do Android do Flutter 3.50 usa
          # uma API do Java 21 e quebrava o build de release com o 17.
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixa, e a mesma do `environment` do pubspec: a "última estável"
          # muda sozinha, e foi assim que a 3.50 reprovou a análise inteira
          # (material.dart obsoleto) sem nada ter mudado no app. Subir de
          # versão é uma decisão, feita aqui e nas máquinas que compilam.
          flutter-version: 3.50.0
          cache: true

      - name: Gerar pasta android/ se ainda não versionada
        run: |
          if [ ! -d android ]; then
            flutter create --org com.deskside --project-name deskside_client --platforms=android .
          fi

      # Release, e não debug: só o release roda o `lintVital`, que foi onde o
      # build do Codemagic quebrou com o Flutter 3.50 e o Java 17. O debug
      # passava e escondia o problema. Sem chave de loja aqui: o modelo do
      # `flutter create` assina o release com a chave de depuração.
      - name: Build APK (release)
        run: flutter build apk --release --no-shrink

      - uses: actions/upload-artifact@v7
        with:
          name: deskside-android-release
          path: client/build/app/outputs/flutter-apk/app-release.apk
