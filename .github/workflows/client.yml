# Cliente Flutter: análise estática + testes de widget + APK Android.
# O Android é coberto aqui e no emulador local; iOS fica no codemagic.yaml
# (runner macOS do GitHub custa 10x a cota — evitamos usá-lo para o cliente).
name: Client (Flutter)

on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes de widget
        run: flutter test

  android-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar pasta android/ se ainda não versionada
        run: |
          if [ ! -d android ]; then
            flutter create --org com.remoteone --project-name remoteone_client --platforms=android .
          fi

      - name: Build APK (debug)
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: remoteone-android-debug
          path: client/build/app/outputs/flutter-apk/app-debug.apk
