# Agente Rust no Windows, mais formatação e auditoria das dependências.
#
# Linux e Mac têm workflows próprios (agente-linux.yml e agente-mac.yml), que
# instalam as bibliotecas do sistema que o agente precisa lá, testam e montam
# os instaladores. Aqui fica o Windows - a plataforma principal - e o que vale
# para todas: `cargo fmt` e o `cargo audit`.
name: Agent (Rust)

on:
  push:
    # A branch de desenvolvimento também: é dela que o servidor e os
    # instaladores saem. Só na `main`, estes testes nunca rodavam.
    branches: [main, "claude/**"]
    paths: ["agent/**", ".github/workflows/agent.yml"]
  pull_request:
    paths: ["agent/**", ".github/workflows/agent.yml"]

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Formatação
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Testes
        run: cargo test

      - name: Build release
        run: cargo build --release

  # Vulnerabilidades conhecidas (base RustSec) no Cargo.lock. Os alertas aceitos,
  # com o motivo de cada um, estão em agent/.cargo/audit.toml.
  auditoria:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Formatação
        run: cargo fmt --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Auditoria das dependências
        run: cargo audit
