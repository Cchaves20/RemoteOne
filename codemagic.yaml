# Build de iOS/iPadOS em Macs na nuvem (Codemagic) — dispensa possuir um Mac.
#
# Dois caminhos:
#  - ios-sideload: gera um .ipa NÃO ASSINADO para instalar via Sideloadly com
#    Apple ID grátis (ver docs/instalar-no-iphone.md). Não exige conta paga.
#  - ios-testflight: build assinado para o TestFlight (exige Apple Developer
#    Program, US$ 99/ano). Deixado comentado para o futuro.

workflows:
  ios-sideload:
    name: iOS (.ipa não assinado para sideload)
    instance_type: mac_mini_m2
    # 90 min: o framework nativo do WebRTC é grande e o pod install pesa.
    max_build_duration: 90
    working_directory: client
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
        # Enquanto os spikes do WebRTC estão em andamento, a branch de
        # desenvolvimento também gera .ipa — é assim que o S1 é respondido.
        - pattern: 'claude/*'
          include: true
    scripts:
      - name: Gerar pasta ios/ se ainda não versionada
        script: |
          if [ ! -d ios ]; then
            flutter create --org com.deskside --project-name deskside_client --platforms=ios .
          fi
      - name: Dependências
        script: flutter pub get
      - name: Ícone e splash (não bloqueia o build se falhar)
        script: |
          dart run flutter_launcher_icons || echo "aviso: geração de ícone falhou"
          dart run flutter_native_splash:create || echo "aviso: geração de splash falhou"
      - name: Requisitos do flutter_webrtc (iOS 13+ e chaves de permissão)
        script: |
          # O flutter_webrtc exige iOS 13 no mínimo. Como a pasta ios/ é
          # gerada a cada build, o ajuste tem que ser por script — e antes do
          # `flutter build`, que é quem roda o pod install.
          if grep -q "^platform :ios" ios/Podfile; then
            perl -pi -e "s/^platform :ios.*/platform :ios, '13.0'/" ios/Podfile
          else
            printf "platform :ios, '13.0'\n" | cat - ios/Podfile > ios/Podfile.novo
            mv ios/Podfile.novo ios/Podfile
          fi
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          # O binário do WebRTC referencia câmera e microfone. O Deskside só
          # recebe vídeo e não usa nenhum dos dois, mas sem estas chaves o iOS
          # encerra o app caso alguma dessas APIs seja tocada.
          PLIST=ios/Runner/Info.plist
          MOTIVO="Nao utilizado: o Deskside apenas recebe a tela e o som do computador."
          for KEY in NSCameraUsageDescription NSMicrophoneUsageDescription; do
            /usr/libexec/PlistBuddy -c "Add :$KEY string $MOTIVO" "$PLIST" \
              || /usr/libexec/PlistBuddy -c "Set :$KEY $MOTIVO" "$PLIST"
          done
          # Rede local: desde o iOS 14 o sistema BLOQUEIA falar com IPs da
          # propria rede sem esta chave e sem o usuario autorizar. E por ela
          # que passa o caminho direto celular <-> PC quando os dois estao no
          # mesmo Wi-Fi - sem ela o WebRTC nao fecha em casa, que e justamente
          # onde deveria ser mais facil.
          REDE="Conectar direto ao seu computador quando os dois estao na mesma rede."
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string $REDE" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSLocalNetworkUsageDescription $REDE" "$PLIST"
          echo "--- Podfile ---"; head -3 ios/Podfile
      - name: Permissão de Face ID no Info.plist
        script: |
          PLIST=ios/Runner/Info.plist
          REASON="Desbloquear o Deskside"
          /usr/libexec/PlistBuddy -c "Add :NSFaceIDUsageDescription string $REASON" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :NSFaceIDUsageDescription $REASON" "$PLIST"
      - name: Nome do app embaixo do ícone
        script: |
          # Sem isto o iPhone mostra "Deskside Client": o `flutter create` usa
          # o `--project-name` (deskside_client) como nome visível, e ninguém
          # nunca corrigiu. O nome do projeto continua com sufixo porque é ele
          # que dá o identificador do pacote; o que a pessoa lê é outro campo.
          PLIST=ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Deskside" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Deskside" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$PLIST"
      - name: Análise e testes
        script: |
          # Antes do `analyze`, porque é mais rápido e a mensagem é melhor: uma
          # string não fechada em `strings.dart` faz o compilador reclamar de
          # dezenas de "getter não definido" — um por palavra da frase que virou
          # código. Ver scripts/conferir-textos.py.
          python3 ../scripts/conferir-textos.py lib/l10n/strings.dart
          flutter analyze
          flutter test
      - name: Build iOS sem assinatura e empacotar .ipa
        script: |
          # O `--dart-define` é o que aponta o app para o servidor. Sem ele
          # vale o padrão embutido em `lib/config.dart` — que hoje é o mesmo
          # endereço, então esquecer aqui não quebra nada. A linha existe para o
          # endereço ficar **visível no build**: ele era `localhost`, e num
          # celular localhost é o próprio celular. O defeito passou meses sem
          # aparecer porque quem desenvolve tinha a URL salva na tela de login.
          flutter build ios --release --no-codesign \
            --dart-define=DESKSIDE_BACKEND=https://deskside.com.br
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -r Deskside-unsigned.ipa Payload
          ls -la "$CM_BUILD_DIR/client/build/ipa"
    # Caminhos cobrindo as duas interpretações (relativo à working_directory e
    # à raiz do clone) + um glob que acha o .ipa em qualquer lugar.
    artifacts:
      - build/ipa/*.ipa
      - client/build/ipa/*.ipa
      - "**/*.ipa"

  # ios-testflight:
  #   name: iOS (TestFlight — exige Apple Developer)
