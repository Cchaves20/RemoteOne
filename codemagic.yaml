# Build de iOS/iPadOS em Macs na nuvem (Codemagic) — dispensa possuir um Mac.
#
# Passos para ativar:
#   1. Crie uma conta em https://codemagic.io e conecte este repositório.
#   2. O workflow abaixo já compila sem assinatura (valida o código iOS).
#   3. Para instalar no seu iPhone/iPad via TestFlight:
#      a. Assine o Apple Developer Program (US$ 99/ano).
#      b. No Codemagic, crie o grupo de variáveis "app_store" com a chave da
#         App Store Connect API (o painel guia o processo).
#      c. Descomente as seções marcadas com "TestFlight" abaixo.

workflows:
  ios-build:
    name: iOS (sem Mac local)
    instance_type: mac_mini_m2
    max_build_duration: 45
    working_directory: client
    environment:
      flutter: stable
      xcode: latest
      # TestFlight: descomente após configurar as credenciais no painel.
      # groups:
      #   - app_store
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.remoteone.remoteoneClient
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Gerar pasta ios/ se ainda não versionada
        script: |
          if [ ! -d ios ]; then
            flutter create --org com.remoteone --project-name remoteone_client --platforms=ios .
          fi
      - name: Dependências
        script: flutter pub get
      - name: Análise e testes
        script: |
          flutter analyze
          flutter test
      - name: Build iOS sem assinatura
        script: flutter build ios --no-codesign
      # TestFlight: substitua o passo acima por build assinado.
      # - name: Build IPA assinado
      #   script: flutter build ipa --export-options-plist=/Users/builder/export_options.plist
    # TestFlight: descomente para publicar automaticamente.
    # artifacts:
    #   - client/build/ios/ipa/*.ipa
    # publishing:
    #   app_store_connect:
    #     auth: integration
    #     submit_to_testflight: true
