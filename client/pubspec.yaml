name: remoteone_client
description: Cliente multiplataforma do RemoteOne (iOS, Android, iPadOS, Windows)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.0
  wakelock_plus: ^1.2.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/remoteone_glyph.png

# Ícone do app (gerado por `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  image_path: "assets/icon/remoteone.png"
  remove_alpha_ios: true
  ios: true
  android: false

# Splash screen (gerada por `dart run flutter_native_splash:create`).
flutter_native_splash:
  color: "#0D0F20"
  image: assets/icon/remoteone_glyph.png
  fullscreen: true
  ios: true
  android: false
