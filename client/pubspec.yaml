name: deskside_client
description: Cliente multiplataforma do Deskside (iOS, Android, iPadOS, Windows)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  # A 9.x prendia o `win32` na ^5, e o file_picker 12 pede a ^6 — o `pub get`
  # recusava a combinação. Subir aqui era a saída que o próprio pub apontou.
  #
  # O que eu conferi antes de subir, porque esta biblioteca guarda o token de
  # login: a API (`FlutterSecureStorage()`, read/write/delete) não mudou, então
  # `token_store.dart` fica igual; no iOS o Keychain continua sendo o mesmo
  # mecanismo; e o lado Android da 11 é Java puro, sem uma linha de Kotlin —
  # ou seja, imune ao problema de AGP 9 que derrubou o file_picker.
  #
  # O preço: a 11 exige minSdk 24 (Android 7, de 2016), e o changelog avisa que
  # dado guardado pelos algoritmos antigos do Android não é migrado num pulo
  # direto da 9 para a 11. Não há instalação Android nossa no mundo, então não
  # há o que migrar; no iPhone, se o login cair, é entrar de novo uma vez.
  flutter_secure_storage: ^11.1.0
  wakelock_plus: ^1.2.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  # Spike S1 do plano de WebRTC (docs/webrtc-plano.md). Traz o framework
  # nativo do WebRTC, que é grande — se o spike reprovar, sai daqui.
  flutter_webrtc: ^1.5.0
  # Transferência de arquivos: escolher no iPhone (file_picker), guardar num
  # arquivo temporário (path_provider) e oferecer "Salvar em Arquivos" pela
  # folha de compartilhamento do iOS (share_plus) — que é como o iPhone deixa
  # o usuário escolher onde guardar sem pedir permissão nenhuma.
  # A 11.x não compila no Android com AGP 9: o `android/build.gradle` dela
  # deixa de aplicar o plugin de Kotlin achando que o AGP 9 compila Kotlin
  # sozinho, o Kotlin do plugin não compila, e o registrador gerado pelo
  # Flutter não acha a classe. A 12.x quebrou o pacote em um por plataforma e
  # o do Android respeita `android.builtInKotlin` — ver codemagic.yaml.
  #
  # `^12.2.0` de propósito, sem deixar cair para a 11: a 12 exige Flutter
  # 3.38+, e se a máquina de build for mais velha eu prefiro que o `pub get`
  # recuse na hora, com o motivo escrito, a resolver para a 11 e falhar cinco
  # minutos depois com "cannot find symbol".
  file_picker: ^12.2.0
  path_provider: ^2.1.0
  # Faixa larga de propósito: as versões mais novas do share_plus exigem um
  # Flutter bem recente, e a API que usamos (SharePlus.instance.share com
  # ShareParams) é a mesma desde a 11. Assim o pub escolhe o que couber no
  # Flutter de cada máquina em vez de recusar a resolução.
  share_plus: ">=11.0.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/deskside_glyph.png

# Ícone do app (gerado por `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  image_path: "assets/icon/deskside.png"
  remove_alpha_ios: true
  ios: true
  android: false

# Splash screen (gerada por `dart run flutter_native_splash:create`).
flutter_native_splash:
  color: "#0D0F20"
  image: assets/icon/deskside_glyph.png
  fullscreen: true
  ios: true
  android: false
