name: deskside_client
description: Cliente multiplataforma do Deskside (iOS, Android, iPadOS, Windows)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.0
  # A 9.x prendia o `win32` na ^5, e o file_picker 12 pede a ^6 — o `pub get`
  # recusava a combinação. Subir aqui era a saída que o próprio pub apontou.
  #
  # O que eu conferi antes de subir, porque esta biblioteca guarda o token de
  # login: a API (`FlutterSecureStorage()`, read/write/delete) não mudou, então
  # `token_store.dart` fica igual; no iOS o Keychain continua sendo o mesmo
  # mecanismo; e o lado Android da 11 é Java puro, sem uma linha de Kotlin —
  # ou seja, imune ao problema de AGP 9 que derrubou o file_picker.
  #
  # O preço: a 11 exige minSdk 24 (Android 7, de 2016), e o changelog avisa que
  # dado guardado pelos algoritmos antigos do Android não é migrado num pulo
  # direto da 9 para a 11. Não há instalação Android nossa no mundo, então não
  # há o que migrar; no iPhone, se o login cair, é entrar de novo uma vez.
  flutter_secure_storage: ^11.1.0
  wakelock_plus: ^1.2.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  # Spike S1 do plano de WebRTC (docs/webrtc-plano.md). Traz o framework
  # nativo do WebRTC, que é grande — se o spike reprovar, sai daqui.
  flutter_webrtc: ^1.5.0
  # Transferência de arquivos: escolher no iPhone (file_picker), guardar num
  # arquivo temporário (path_provider) e oferecer "Salvar em Arquivos" pela
  # folha de compartilhamento do iOS (share_plus) — que é como o iPhone deixa
  # o usuário escolher onde guardar sem pedir permissão nenhuma.
  # A 11.x não compila no Android com AGP 9: o `android/build.gradle` dela
  # deixa de aplicar o plugin de Kotlin achando que o AGP 9 compila Kotlin
  # sozinho, o Kotlin do plugin não compila, e o registrador gerado pelo
  # Flutter não acha a classe. A 12.x quebrou o pacote em um por plataforma e
  # o do Android respeita `android.builtInKotlin` — ver codemagic.yaml.
  #
  # `^12.2.0` de propósito, sem deixar cair para a 11: a 12 exige Flutter
  # 3.38+, e se a máquina de build for mais velha eu prefiro que o `pub get`
  # recuse na hora, com o motivo escrito, a resolver para a 11 e falhar cinco
  # minutos depois com "cannot find symbol".
  file_picker: ^12.2.0
  path_provider: ^2.1.0
  # Faixa larga de propósito: as versões mais novas do share_plus exigem um
  # Flutter bem recente, e a API que usamos (SharePlus.instance.share com
  # ShareParams) é a mesma desde a 11. Assim o pub escolhe o que couber no
  # Flutter de cada máquina em vez de recusar a resolução.
  share_plus: ">=11.0.0 <14.0.0"
  # Compra dentro do app (StoreKit no iOS, Play Billing no Android).
  #
  # Só responde em build vindo da App Store ou do TestFlight. Num app instalado
  # por sideload a loja devolve **lista de produtos vazia, sem erro nenhum** —
  # e é por isso que a tela de assinatura diz "indisponível" em vez de ficar
  # girando: a ausência de produto é o sintoma normal fora da loja, não uma
  # falha a ser tentada de novo.
  in_app_purchase: ^3.3.1
  # Abrir os Termos de Uso e a Política de Privacidade no navegador.
  #
  # O projeto evitou esta dependência por bom motivo (ver devices_screen.dart:
  # copiar um endereço serve melhor que abri-lo quando ele tem de ser digitado
  # noutro computador). Aqui ela se paga: a diretriz 3.1.2 da Apple exige
  # **links funcionais** para os dois documentos na tela de compra, e texto
  # copiável não é link. É a rejeição mais comum de app de assinatura.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/deskside_glyph.png

# Ícone do app (gerado por `dart run flutter_launcher_icons`).
#
# O Android estava em `false`, e por isso o APK saía com o robozinho padrão do
# Flutter enquanto o iOS já tinha o ícone certo. O comando roda nos três
# workflows do Codemagic — ele gerava só metade do que parecia gerar.
flutter_launcher_icons:
  image_path: "assets/icon/deskside.png"
  remove_alpha_ios: true
  ios: true
  android: true
  # Ícone adaptativo: duas camadas, e o Android recorta o conjunto com a
  # máscara que o fabricante escolheu — redonda, quadrada arredondada ou
  # "squircle". Sem estas duas linhas o sistema pega a imagem quadrada e a
  # recorta do mesmo jeito, comendo as bordas.
  adaptive_icon_background: "#0D0F20"
  # Camada de frente **com folga**, e não o glifo cheio.
  #
  # O recorte é um círculo de 72dp num quadro de 108dp. Medido: o glifo a 66%
  # do quadro — a folga que se costuma recomendar — perde 12% nos cantos do
  # monitor. A 54% não perde nada em nenhuma das três máscaras. Ver
  # `scripts/gerar-icone-adaptativo.py`, que refaz o arquivo e confere a conta.
  adaptive_icon_foreground: "assets/icon/deskside_adaptativo.png"
  # O Android 8 é quem trouxe o ícone adaptativo; abaixo disso vale o
  # `image_path`, que já tem o fundo escuro embutido. O app pede 24 de mínimo,
  # então na prática todo aparelho alcançado usa o adaptativo.
  min_sdk_android: 24

# Splash screen (gerada por `dart run flutter_native_splash:create`).
flutter_native_splash:
  color: "#0D0F20"
  image: assets/icon/deskside_glyph.png
  fullscreen: true
  ios: true
  android: false
