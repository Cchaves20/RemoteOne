# Stack de desenvolvimento local: API + PostgreSQL + Redis.
# Uso: docker compose up --build  (a API fica em http://localhost:8000)
#
# Para rodar sem terminal ativo: `docker compose up -d --build` (destacado) e,
# no Docker Desktop, ative "Start Docker Desktop when you sign in". Com o
# `restart: unless-stopped` abaixo, a stack volta sozinha ao ligar o PC.
# Ver docs/rodar-sem-terminal.md.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DESKSIDE_DATABASE_URL: postgresql://deskside:deskside@db:5432/deskside
      DESKSIDE_REDIS_URL: redis://redis:6379/0
      # Segredo de desenvolvimento. Em produção, defina um valor forte e único.
      DESKSIDE_JWT_SECRET: dev-only-change-me
    depends_on:
      - db
      - redis
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskside
      POSTGRES_PASSWORD: deskside
      POSTGRES_DB: deskside
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
