[project]
name = "deskside-backend"
version = "0.1.0"
description = "Backend do Deskside: autenticação, pareamento e comunicação em tempo real"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "email-validator>=2.1",
    "pyotp>=2.9",
    # Cifra em repouso do segredo do 2FA (app/cofre.py).
    "cryptography>=43",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends()`/`HTTPBearer()` em defaults é o padrão idiomático do FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
